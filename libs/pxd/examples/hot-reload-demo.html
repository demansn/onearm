<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>pxd — hot-reload demo</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #0b0f17; color: #e5e7eb; }
        header { padding: 12px 16px; display: flex; gap: 12px; align-items: center; background: #1f2937; }
        button { padding: 8px 14px; background: #374151; color: inherit; border: 0; border-radius: 6px; cursor: pointer; }
        button:hover { background: #4b5563; }
        #app { display: flex; justify-content: center; padding: 24px; }
        canvas { background: #111827; border-radius: 8px; }
        .tag { padding: 4px 8px; border-radius: 4px; background: #111827; font-size: 12px; }
    </style>
</head>
<body>
    <header>
        <strong>pxd hot-reload demo</strong>
        <span class="tag" id="tagDisplay">tags: desktop, en</span>
        <button id="toggleMobile">Toggle mobile</button>
        <button id="cycleLocale">Cycle locale</button>
        <button id="toggleDark">Toggle dark</button>
        <button id="randomize">Randomize positions</button>
        <span style="opacity:.6">Open devtools — apply() returns patched-node count</span>
    </header>
    <div id="app"></div>

    <!--
        Demo doc is inline so the file runs from disk without a server.
        Real usage: fetch a JSON file, watch it, call apply on change.
    -->
    <script type="module">
        import { Application, Container, Text, Graphics, Texture } from "https://esm.sh/pixi.js@8.7.0";
        import { build, apply, requirePath } from "../dist/src/index.js";

        const doc = {
            format: "pxd", version: 1,
            root: {
                id: "scene", type: "container", x: 24, y: 24,
                children: [
                    {
                        id: "panel", type: "graphics", shape: "roundRect",
                        width: { _: 600, mobile: 320 },
                        height: { _: 380, mobile: 480 },
                        radius: 16,
                        fill:   { _: "#1f2937", dark: "#0b0f17" },
                        stroke: { _: "#374151", dark: "#1f2937" }, strokeWidth: 1,
                    },
                    {
                        id: "title", type: "text",
                        text: { _: "Hello, {user.name}!", ru: "Привет, {user.name}!", de: "Hallo, {user.name}!" },
                        x: 24, y: 20,
                        style: { fontSize: 28, fill: "#f9fafb", fontWeight: "700" },
                    },
                    {
                        id: "subtitle", type: "text",
                        text: { _: "Resize, swap locale, toggle dark.", ru: "Меняй язык, размер, тему.", de: "Sprache, Größe, Theme umschalten." },
                        x: 24, y: 60,
                        style: { fontSize: 14, fill: "#9ca3af" },
                    },
                    {
                        id: "ball", type: "graphics", shape: "circle",
                        radius: 28,
                        fill: { _: "#22c55e", dark: "#16a34a" },
                        x: { _: 120, mobile: 80 }, y: { _: 220, mobile: 280 },
                    },
                    {
                        id: "box", type: "graphics", shape: "rect",
                        width: 80, height: 80,
                        fill: { _: "#3b82f6", dark: "#1d4ed8" },
                        x: { _: 260, mobile: 180 }, y: { _: 200, mobile: 260 },
                    },
                ],
            },
        };

        const app = new Application();
        await app.init({ width: 660, height: 440, background: "#111827", antialias: true });
        document.getElementById("app").appendChild(app.canvas);

        const state = {
            tags: new Set(["desktop", "en"]),
            user: { name: "player" },
        };
        const locales = ["en", "ru", "de"];
        let localeIdx = 0;

        const resolvers = {
            texture: () => Texture.EMPTY,
            binding: (path) => {
                if (path === "user.name") return state.user.name;
                return `{${path}}`;
            },
        };

        const root = build(doc, {
            resolve: resolvers,
            activeTags: [...state.tags],
        });
        app.stage.addChild(root);

        function refresh() {
            const n = apply(doc, root, {
                resolve: resolvers,
                activeTags: [...state.tags],
                onMissing: (path, id) => console.warn("PXD miss", path, id),
            });
            console.log(`apply patched ${n} nodes — tags: [${[...state.tags].join(", ")}]`);
            document.getElementById("tagDisplay").textContent =
                `tags: ${[...state.tags].join(", ")}`;
        }

        document.getElementById("toggleMobile").onclick = () => {
            if (state.tags.has("mobile")) state.tags.delete("mobile");
            else { state.tags.add("mobile"); state.tags.delete("desktop"); }
            if (!state.tags.has("mobile")) state.tags.add("desktop");
            refresh();
        };
        document.getElementById("cycleLocale").onclick = () => {
            const prev = locales[localeIdx];
            state.tags.delete(prev);
            localeIdx = (localeIdx + 1) % locales.length;
            state.tags.add(locales[localeIdx]);
            refresh();
        };
        document.getElementById("toggleDark").onclick = () => {
            if (state.tags.has("dark")) state.tags.delete("dark");
            else state.tags.add("dark");
            refresh();
        };
        document.getElementById("randomize").onclick = () => {
            // Mutate doc in-place — apply re-resolves from the latest object.
            const ball = doc.root.children.find(c => c.id === "ball");
            const box  = doc.root.children.find(c => c.id === "box");
            ball.x = 60 + Math.random() * 480;
            ball.y = 140 + Math.random() * 220;
            box.x  = 60 + Math.random() * 480;
            box.y  = 140 + Math.random() * 220;
            refresh();
        };

        // Demonstrate find/requirePath for free.
        const title = requirePath(root, "title");
        console.log("title Container:", title, "label:", title.label);
    </script>
</body>
</html>
